default_stages = ["pre-commit"]
[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "mixed-line-ending" },
  { id = "check-merge-conflict" },
  { id = "check-added-large-files" },
  { id = "check-yaml" },
  { id = "check-toml" },
  { id = "detect-private-key" },
]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "rustfmt"
name = "rustfmt"
language = "system"
entry = "cargo fmt --all -- --check"
files = '\.rs$'
pass_filenames = false

[[repos.hooks]]
id = "clippy"
name = "clippy"
language = "system"
entry = "cargo clippy --workspace --all-targets --locked -- -D warnings"
files = '(\.rs|Cargo\.(toml|lock))$'
pass_filenames = false

[[repos.hooks]]
id = "ast-grep-scan"
name = "ast-grep project rules"
language = "system"
entry = "ast-grep scan"
files = '\.rs$'

[[repos.hooks]]
id = "ast-grep-test"
name = "ast-grep rule tests"
language = "system"
entry = "ast-grep test"
files = '^(sgconfig\.yml|lint/ast-grep/)'
pass_filenames = false

[[repos.hooks]]
id = "check-pr-message-test"
name = "check-pr-message self-test"
language = "system"
entry = "lint/scripts/check-pr-message-test.sh"
files = '^lint/scripts/check-pr-message'
pass_filenames = false

[[repos.hooks]]
id = "shellcheck"
name = "shellcheck"
language = "system"
entry = "shellcheck"
types = ["shell"]

[[repos.hooks]]
id = "hadolint"
name = "hadolint"
language = "system"
entry = "hadolint"
files = '(^|/)Containerfile$'

[[repos.hooks]]
id = "actionlint"
name = "actionlint"
language = "system"
entry = "actionlint"
files = '^\.github/workflows/.*\.ya?ml$'

[[repos.hooks]]
id = "install-test"
name = "install.sh self-test"
language = "system"
entry = "deploy/install-test.sh"
files = '^deploy/(install\.sh|install-test\.sh|factory\.container)$'
pass_filenames = false

[[repos.hooks]]
id = "tests-accompany-changes"
name = "code changes come with tests"
language = "system"
entry = "lint/scripts/tests-accompany-changes.sh"
stages = ["manual"]
always_run = true
pass_filenames = false

[[repos.hooks]]
id = "tests-accompany-changes-test"
name = "tests-accompany-changes self-test"
language = "system"
entry = "lint/scripts/tests-accompany-changes-test.sh"
files = '^lint/scripts/tests-accompany-changes'
pass_filenames = false
