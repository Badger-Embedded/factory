name: CI
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the PR's commits and the base branch are both present.
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - uses: Swatinem/rust-cache@v2
      - name: Lint (all prek hooks)
        run: nix develop -c just lint
      - name: Code changes come with tests
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: nix develop -c just check-tests "origin/$BASE_REF"
      - name: Test
        run: nix develop -c just test
  e2e:
    name: Browser tests
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('e2e/package-lock.json') }}
          restore-keys: npm-
      - name: Browser tests
        env:
          CI: true
        run: nix develop -c just e2e
      - name: Upload the report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
