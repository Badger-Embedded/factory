[package]
name = "factory-server"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.23.1"
chacha20poly1305 = "0.10.1"
factory-core = { version = "0.1.0", path = "../factory-core" }
factory-runner = { version = "0.1.0", path = "../factory-runner" }
maud = { version = "0.27.0", features = ["axum"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "fs", "signal", "sync", "time"] }
tokio-stream = "0.1.17"
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.29.3", features = ["v4"] }

[dev-dependencies]
base64 = "0.23.1"
boa_engine = "0.20.0"
http-body-util = "0.1.5"
tokio-stream = "0.1.17"
tower = { version = "0.5.3", features = ["util"] }
