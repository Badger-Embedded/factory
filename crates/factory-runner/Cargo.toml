[package]
name = "factory-runner"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.23.1"
factory-core = { version = "0.1.0", path = "../factory-core" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["process", "io-util", "rt", "macros", "time"] }
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "net"] }
toml = "1.2.1"
