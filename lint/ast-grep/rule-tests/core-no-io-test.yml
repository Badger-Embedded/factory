id: core-no-io
valid:
  - 'use std::collections::BTreeMap;'
  - 'use std::{fmt, collections::BTreeMap};'
  - 'fn stage(j: &Job) -> &Stage { &j.stage }'
  - 'let f = std::fmt::format(args);'
invalid:
  - 'use std::fs;'
  - 'use std::io::Read;'
  - 'use std::{collections::BTreeMap, net::TcpStream};'
  - 'pub(crate) use std::process::Command;'
  - 'use std::time::SystemTime;'
  - 'fn load() { let s = std::fs::read_to_string("/etc/factory.toml"); }'
  - 'fn run() { std::process::Command::new("podman").status(); }'
  - 'fn token() { std::env::var("GH_TOKEN"); }'
